build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreAnnotated:
      - 'Composable'
      - 'Test'
  LongMethod:
    active: true
    threshold: 60
    ignoreAnnotated:
      - 'Composable'
      - 'Test'
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - 'Composable'
  NestedBlockDepth:
    active: true
    threshold: 4
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    active: false
  LargeClass:
    active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  InjectDispatcher:
    active: false

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '^([a-z][a-zA-Z0-9]*|[A-Z][a-zA-Z0-9]*)$'
  TopLevelPropertyNaming:
    active: false
  MatchingDeclarationName:
    active: false
  ClassNaming:
    active: false

performance:
  active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true

style:
  active: true
  MagicNumber:
    active: false
  UnusedImports:
    active: true
  WildcardImport:
    active: false
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|preview.*)'
  MaxLineLength:
    active: true
    maxLineLength: 160
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  UseCheckOrError:
    active: false
  ReturnCount:
    active: false

formatting:
  active: false

# Compose Rules (io.nlopez.compose.rules:detekt)
Compose:
  ComposeNaming:
    active: true
  ComposeModifierMissing:
    active: true
  ComposeModifierReused:
    active: true
  ComposeModifierWithoutDefault:
    active: true
  ComposeParameterOrder:
    active: true
  ComposeRememberMissing:
    active: true
  ComposeMutableParameters:
    active: true
  ComposeViewModelInjection:
    active: false
  ComposeContentEmitterReturningValues:
    active: true
  CompositionLocalAllowlist:
    active: false
  ParameterNaming:
    active: true
  MultipleEmitters:
    active: true
